<script>
/* Resolve the theme before first paint so there is no flash of the wrong one.
   Reads the same key the app writes through window.storage ("bp:" prefix). */
(function(){
  try{
    var t=localStorage.getItem('bp:bagpull:theme');
    if(t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme:dark)').matches))
      document.documentElement.classList.add('dark');
  }catch(e){}
})();
</script>
<style>
  html{ color-scheme:light; }
  html.dark{ color-scheme:dark; }
  html,body{ margin:0; padding:0; background:#FAFAF9; }
  html.dark, html.dark body{ background:#0F1211; }
  body{ overscroll-behavior-y:none; }
</style>
</head>

<script>
/* Standalone storage shim.
   In the chat preview window.storage is provided by the host.
   Deployed on a normal web server it is not, so fall back to localStorage
   with the same promise-based shape the app expects. */
(function(){
  if (window.storage && typeof window.storage.get === 'function') return;
  var mem = {};
  function has(){ try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; } catch(e){ return false; } }
  var ok = has();
  function read(k){ return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); }
  function write(k,v){ if(ok) localStorage.setItem(k,v); else mem[k]=v; }
  function del(k){ if(ok) localStorage.removeItem(k); else delete mem[k]; }
  window.storage = {
    get: function(k){ var v = read('bp:'+k); return Promise.resolve(v===null?null:{key:k,value:v}); },
    set: function(k,v){ write('bp:'+k,String(v)); return Promise.resolve({key:k,value:v}); },
    delete: function(k){ del('bp:'+k); return Promise.resolve({key:k,deleted:true}); },
    list: function(p){
      var out=[];
      if(ok){ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
        if(k.indexOf('bp:')===0){ var s=k.slice(3); if(!p||s.indexOf(p)===0) out.push(s); } } }
      else { for(var k2 in mem){ var s2=k2.slice(3); if(!p||s2.indexOf(p)===0) out.push(s2); } }
      return Promise.resolve({keys:out});
    }
  };
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

*,*::before,*::after{ box-sizing:border-box; }

/* ============================================================
   TOKENS — semantic only. Nothing below this block uses raw hex.
   The .dark class is set by JS (system / light / dark preference).
   ============================================================ */
:root{
  --bg:#FAFAF9;  --surface:#FFFFFF;  --surface-2:#F5F5F4;  --surface-3:#EFEEEC;
  --ink:#1C1917; --ink-2:#44403C;    --ink-3:#78716C;
  --line:#E7E5E4; --line-2:#D6D3D1;
  --brand:#14352A; --brand-2:#1B4433; --brand-3:#0E2820;
  --on-brand:#F2F5F2; --on-brand-2:#9DB3A6;
  --gold:#A16207; --gold-soft:#FAF3E6; --gold-line:#E3CE9E; --gold-lit:#D9B15F;
  --ok:#3F6B52;  --ok-soft:#EDF3EF;  --ok-line:#C8DFD1;
  --warn:#8A5D0F;--warn-soft:#FBF3E3; --warn-line:#EBD9AE;
  --bad:#B4472F; --bad-soft:#FBEEEA; --bad-line:#F0D2C8;
  --info:#33607D;--info-soft:#EAF1F6;
  --cart:#14352A; --cart-soft:#EAF0EC; --cart-line:#C3D2C8;  /* carts read as house colour */
  --sh-1:0 1px 2px rgba(28,25,23,.05);
  --sh-2:0 1px 2px rgba(28,25,23,.05), 0 6px 18px rgba(28,25,23,.06);
  --sh-3:0 -10px 44px rgba(12,10,9,.20);
  --scrim:rgba(12,10,9,.55);
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px;
  --gut:16px;
}
:root.dark{
  --bg:#0F1211;  --surface:#171A19;  --surface-2:#1E2220;  --surface-3:#262B28;
  --ink:#F0EFEC; --ink-2:#C7C4BE;    --ink-3:#93908A;
  --line:#2A2E2C; --line-2:#3A403D;
  --brand:#102A20; --brand-2:#16382B; --brand-3:#0B1F17;
  --on-brand:#EAF0EC; --on-brand-2:#8FA89A;
  --gold:#D9B15F; --gold-soft:#241E11; --gold-line:#4C3D1E; --gold-lit:#E8C883;
  --ok:#7FBF97;  --ok-soft:#16241C;  --ok-line:#2C4636;
  --warn:#DDB05A;--warn-soft:#241C0F; --warn-line:#4A3C1E;
  --bad:#E08268; --bad-soft:#2A1712; --bad-line:#4A2A20;
  --info:#8ABBD9;--info-soft:#12212A;
  --cart:#D9B15F; --cart-soft:#241E11; --cart-line:#4C3D1E;
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.30);
  --sh-3:0 -10px 44px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.66);
}

/* ============================================================
   SHELL
   ============================================================ */
.bp{ background:var(--bg); color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; max-width:680px; margin:0 auto; min-height:100vh;
  padding-bottom:96px; position:relative; -webkit-font-smoothing:antialiased; }
.bp.subpage{ padding-bottom:40px; }
.bp button{ font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.bp :focus-visible, .sheet :focus-visible, .drawer :focus-visible{
  outline:2px solid var(--gold); outline-offset:2px; border-radius:4px; }
.ic{ width:18px; height:18px; flex:none; stroke:currentColor; fill:none;
  stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; display:block; }
.ic-xs{ width:14px; height:14px; }
.ic-sm{ width:15px; height:15px; }
.ic-lg{ width:20px; height:20px; }
.ic-xl{ width:26px; height:26px; }
.mono{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }

/* ============================================================
   MASTHEAD
   ============================================================ */
.hdr{ background:var(--brand); color:var(--on-brand);
  padding:14px var(--gut) 16px; border-radius:0 0 var(--r-lg) var(--r-lg);
  position:relative; overflow:hidden; }
.hdr::after{ content:''; position:absolute; left:var(--gut); right:var(--gut); top:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--gold-lit) 22%,var(--gold-lit) 78%,transparent);
  opacity:.65; }
.hdr-top{ display:flex; align-items:center; gap:10px; min-height:40px; }
.menubtn{ display:grid; place-items:center; width:40px; height:40px; flex:none;
  border-radius:var(--r-sm); background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16); color:var(--on-brand); }
.menubtn:hover{ background:rgba(255,255,255,.14); }
.mark{ font-family:'Bodoni Moda',Georgia,serif; font-size:17px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; line-height:1; white-space:nowrap; }
.mark b{ color:var(--gold-lit); font-weight:500; }
.hdr-clock{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;
  font-size:13px; font-weight:500; color:var(--gold-lit); letter-spacing:.02em; white-space:nowrap; }
.hdr-btn{ display:inline-flex; align-items:center; gap:6px; min-height:40px; flex:none;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);
  border-radius:99px; padding:8px 14px; font-size:13px; font-weight:600; color:var(--on-brand); }
.hdr-btn:hover{ background:rgba(255,255,255,.14); }
.hdr-sub{ font-size:12.5px; color:var(--on-brand-2); margin-top:9px; letter-spacing:.01em; }
.hdr-sub b{ color:var(--gold-lit); font-weight:600; }

.tally{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
  margin-top:10px; padding-bottom:14px;
  border-bottom:1px solid rgba(255,255,255,.10); }
.tally .num{ font-family:'Bodoni Moda',Georgia,serif; font-size:46px; font-weight:500;
  line-height:.9; letter-spacing:-.01em; display:block; }
.tally .num span{ font-family:'Plus Jakarta Sans',sans-serif; font-size:12px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--on-brand-2);
  display:block; margin-top:8px; }
.tally-side{ text-align:right; font-size:12.5px; color:var(--on-brand-2); line-height:1.75; }
.tally-side b{ color:var(--on-brand); font-weight:600;
  font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
.tally-side i{ font-style:normal; color:var(--gold-lit); }

/* ---------- column rail (the moving-rack floor plan) ---------- */
.rail{ display:flex; align-items:flex-end; margin:14px calc(var(--gut) * -1) 0;
  padding:2px var(--gut) 4px; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;
  scroll-snap-type:x proximity; }
.rail::-webkit-scrollbar{ display:none; }
.col{ position:relative; flex:none; scroll-snap-align:center; background:none; border:0; padding:3px;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  min-width:46px; border-radius:var(--r-sm); }
.col + .col{ margin-left:6px; }
.col-faces{ display:flex; align-items:stretch; height:38px; border-radius:var(--r-xs);
  overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.09); }
.face{ width:15px; background:rgba(255,255,255,.07); position:relative; overflow:hidden; }
.face:only-child{ width:22px; }
.face .fill{ position:absolute; left:0; right:0; bottom:0; background:var(--gold-lit); opacity:.85; }
.face.void{ background:rgba(255,255,255,.03); }
.face.full{ background:var(--gold-lit); }
.aisle{ width:3px; background:transparent; }
.col-let{ font-family:'Bodoni Moda',Georgia,serif; font-size:15px; font-weight:600;
  line-height:1; color:var(--on-brand-2); }
.col.void .col-let{ color:rgba(255,255,255,.22); }
.col.now{ background:rgba(217,177,95,.10); box-shadow:0 0 0 1.5px var(--gold-lit); }
.col.now .col-let{ color:var(--gold-lit); }
.col.now .aisle{ width:13px;
  background:repeating-linear-gradient(-45deg,transparent 0 4px,rgba(255,255,255,.16) 4px 5px); }
.col:disabled{ cursor:default; opacity:.5; }
/* divider between H and I — the split between the two halves of the accordion */
.rail-divide{ flex:none; align-self:stretch; width:2px; margin:3px 10px 21px; border-radius:2px;
  background:var(--gold-lit); opacity:.55; }
/* the strip's own scroll bar: always visible, because touch browsers hide the native one */
.railbar{ position:relative; height:6px; margin:10px 2px 0; border-radius:99px;
  background:rgba(255,255,255,.12); touch-action:none; cursor:pointer; }
.railbar::before{ content:''; position:absolute; left:0; right:0; top:-10px; bottom:-10px; }  /* bigger touch area */
.railthumb{ position:absolute; top:0; bottom:0; left:0; min-width:28px; border-radius:99px;
  background:var(--gold-lit); opacity:.8; cursor:grab; touch-action:none; }
.railthumb::before{ content:''; position:absolute; left:0; right:0; top:-10px; bottom:-10px; }
.railthumb:active{ opacity:1; cursor:grabbing; }
@media (prefers-reduced-motion:no-preference){
  .col,.col-let,.face{ transition:box-shadow .2s ease, background-color .2s ease, color .2s ease; }
  .aisle{ transition:width .28s cubic-bezier(.4,0,.2,1); }
}

/* ============================================================
   NAV DRAWER
   ============================================================ */
.dscrim{ position:fixed; inset:0; background:var(--scrim); z-index:50; }
.drawer{ position:fixed; top:0; bottom:0; left:0; z-index:51; width:min(84vw,320px);
  background:var(--surface); color:var(--ink); display:flex; flex-direction:column;
  border-right:1px solid var(--line); box-shadow:12px 0 50px rgba(12,10,9,.30);
  font-family:'Plus Jakarta Sans',sans-serif; }
@media (prefers-reduced-motion:no-preference){
  .drawer{ animation:slidein .22s cubic-bezier(.4,0,.2,1); }
  @keyframes slidein{ from{ transform:translateX(-14px); opacity:.4; } }
}
.drawer button{ font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.drawer-hd{ background:var(--brand); color:var(--on-brand); flex:none;
  padding:calc(18px + env(safe-area-inset-top)) 18px 18px; position:relative; }
.drawer-hd::after{ content:''; position:absolute; left:18px; right:18px; top:0; height:2px;
  background:linear-gradient(90deg,var(--gold-lit),transparent); opacity:.7; }
.drawer-hd .club{ font-size:12.5px; color:var(--on-brand-2); margin-top:7px; line-height:1.5; }
.who{ display:flex; align-items:center; gap:11px; margin-top:16px;
  padding-top:14px; border-top:1px solid rgba(255,255,255,.12); }
.avatar{ width:40px; height:40px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--gold-lit); color:#1A1408; font-weight:700; font-size:14px; letter-spacing:.02em; }
.who .nmw{ min-width:0; }
.who .n1{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.who .n2{ font-size:12px; color:var(--on-brand-2); }
.drawer-nav{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 10px 4px; }
.navsec{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3);
  font-weight:700; padding:16px 12px 6px; }
.navitem{ display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:none; border:0; border-radius:var(--r-sm); padding:12px; min-height:50px;
  font-size:14.5px; font-weight:600; color:var(--ink-2); }
.navitem:hover{ background:var(--surface-2); }
.navitem .ic{ color:var(--ink-3); }
.navitem[aria-current="page"]{ background:var(--surface-2); color:var(--ink); }
.navitem[aria-current="page"] .ic{ color:var(--gold); }
.navitem .count{ margin-left:auto; min-width:22px; height:22px; padding:0 7px; border-radius:99px;
  display:grid; place-items:center; background:var(--bad-soft); color:var(--bad);
  font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600; }
.navitem .chev{ margin-left:auto; color:var(--line-2); }
.drawer-ft{ flex:none; border-top:1px solid var(--line);
  padding:12px 12px calc(12px + env(safe-area-inset-bottom)); }
.ftlabel{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3);
  font-weight:700; margin:0 0 8px 4px; }
.themeseg{ display:flex; background:var(--surface-2); border:1px solid var(--line);
  border-radius:99px; padding:3px; }
.themeseg button{ flex:1; border:0; background:none; border-radius:99px; min-height:38px;
  font-size:12.5px; font-weight:600; color:var(--ink-3);
  display:inline-flex; align-items:center; justify-content:center; gap:5px; }
.themeseg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--sh-1); }

/* ============================================================
   CONTROLS
   ============================================================ */
.ctrl{ padding:14px var(--gut) 4px; position:sticky; top:0; z-index:15;
  background:linear-gradient(var(--bg) 84%, transparent); }
.seg{ display:flex; background:var(--surface-2); border:1px solid var(--line);
  border-radius:99px; padding:3px; }
.seg button{ flex:1; background:none; border:0; min-height:40px; padding:8px 6px;
  border-radius:99px; font-size:13.5px; font-weight:600; color:var(--ink-3);
  display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--sh-1); }
.seg .badge{ display:inline-grid; place-items:center; min-width:19px; height:19px; padding:0 5px;
  border-radius:99px; background:var(--bad); color:#fff; font-size:11px; font-weight:700;
  font-family:'JetBrains Mono',monospace; }
.seg .badge.done{ background:var(--ok); color:#fff; padding:0; width:19px; }
.seg .badge.done .ic{ stroke-width:2.6; }

.row2{ display:flex; gap:8px; margin-top:10px; }
.searchwrap{ flex:1; min-width:0; position:relative; display:flex; align-items:center; }
.searchwrap .ic{ position:absolute; left:14px; color:var(--ink-3); pointer-events:none; }
.search{ width:100%; min-height:44px; border:1px solid var(--line); border-radius:99px;
  padding:10px 16px 10px 40px; font-size:15px; background:var(--surface); color:var(--ink);
  font-family:'Plus Jakarta Sans',sans-serif; box-shadow:var(--sh-1); }
.search::placeholder{ color:var(--ink-3); }
.search:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
.chips{ display:flex; gap:6px; }
.chips button{ border:1px solid var(--line); background:var(--surface); border-radius:99px;
  min-height:44px; padding:0 15px; font-size:13px; font-weight:600; color:var(--ink-2); }
.chips button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

/* ---------- mark-missing action (quiet: the alert itself lives in Updates) ---------- */
.missbtn{ flex:none; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--line); background:var(--surface); border-radius:99px;
  min-height:44px; padding:0 15px; font-size:13px; font-weight:600; color:var(--ink-2);
  box-shadow:var(--sh-1); }
.missbtn:hover{ border-color:var(--warn); color:var(--warn); }
.missbtn .ic{ color:var(--ink-3); }
.missbtn:hover .ic{ color:var(--warn); }

/* ---------- time window ---------- */
.win{ margin-top:10px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-md); padding:12px 16px 10px; box-shadow:var(--sh-1); }
.win .hd{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.win .hd b{ font-size:16px; font-weight:600; letter-spacing:-.01em; }
.win .hd small{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-3); }
.win .rng{ position:relative; height:44px; margin:0 13px; touch-action:none; }
.win .track{ position:absolute; top:50%; left:0; right:0; height:5px; margin-top:-2.5px;
  background:var(--surface-3); border-radius:99px; }
.win .fill{ position:absolute; top:0; bottom:0; background:var(--brand); border-radius:99px; }
:root.dark .win .fill{ background:var(--gold); }
.win .thumb{ position:absolute; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px;
  border-radius:50%; background:var(--surface); border:2.5px solid var(--brand);
  box-shadow:var(--sh-1); cursor:grab; touch-action:none; }
:root.dark .win .thumb{ border-color:var(--gold); }
.win .thumb::after{ content:''; position:absolute; inset:-9px; } /* 44px hit area */
.win .thumb:active,.win .thumb.act{ cursor:grabbing; background:var(--gold-soft); border-color:var(--gold); }
.win .ft{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.win .ft small{ font-size:11.5px; color:var(--ink-3); font-family:'JetBrains Mono',monospace; }
.win .ft small.mid{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; color:var(--ink-2); }
@media (prefers-reduced-motion:no-preference){
  .win .thumb{ transition:background-color .15s ease, border-color .15s ease, transform .15s ease; }
  .win .thumb.act{ transform:scale(1.08); }
}

/* ============================================================
   LIST
   ============================================================ */
.wrap{ padding:6px var(--gut) 0; }
.sec{ display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  padding:22px 4px 10px; }
.sec h3{ margin:0; font-size:12px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); display:flex; align-items:center; gap:8px; }
.sec h3 .let{ font-family:'Bodoni Moda',Georgia,serif; font-size:19px; font-weight:600;
  letter-spacing:0; text-transform:none; color:var(--ink); line-height:1; }
.sec h3 i{ font-style:normal; color:var(--gold); letter-spacing:.06em; }
.sec em{ font-family:'JetBrains Mono',monospace; font-style:normal; font-size:11.5px; color:var(--ink-3); }
.sec.clear h3 .let{ color:var(--ok); }
.sec.clear h3, .sec.clear em{ color:var(--ok); }

.panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--sh-2); padding:8px; }
.track{ position:relative; }
.track::before{ content:''; position:absolute; left:50%; top:6px; bottom:6px;
  border-left:1.5px dashed var(--line-2); transform:translateX(-.75px); }
.track.open::before{ border-color:var(--gold-line); }
.track.solo::before{ display:none; }
.slot{ display:flex; align-items:stretch; }
.cell{ width:50%; padding:3px; }
.track.solo .cell{ width:100%; }

.itm{ display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--surface-2); border:1px solid transparent; border-radius:var(--r-sm);
  padding:9px 11px; min-height:52px; position:relative; }
.cell.right .itm{ flex-direction:row-reverse; text-align:right; }
.itm:hover{ background:var(--surface-3); }
.itm:active{ background:var(--surface-3); }
.tag{ flex:none; min-width:48px; height:36px; display:grid; place-items:center; padding:0 8px;
  border-radius:var(--r-xs); background:var(--ink); color:var(--bg);
  font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;
  font-weight:600; font-size:15px; letter-spacing:-.02em; }
.body{ flex:1; min-width:0; }
.nm{ display:flex; align-items:center; gap:7px; font-weight:600; font-size:14px;
  letter-spacing:-.005em; }
.cell.right .nm{ flex-direction:row-reverse; }
.cell.right .rig{ flex-direction:row-reverse; }
.nmt{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* personal-cart storage code, sits beside the name */
.pcode{ flex:none; font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:600;
  letter-spacing:.06em; color:var(--cart); background:var(--cart-soft);
  border:1px solid var(--cart-line); border-radius:var(--r-xs); padding:2px 5px; line-height:1.3; }
/* what they are taking today — right-hand end of the row */
.rig{ flex:none; display:flex; align-items:center; gap:8px; }
.cartbox{ flex:none; width:34px; height:34px; border-radius:var(--r-xs); display:grid;
  place-items:center; background:var(--cart-soft); border:1px solid var(--cart-line);
  color:var(--cart); }
.cartbox .ic{ width:22px; height:22px; stroke-width:1.7; }
.find .cartbox{ width:38px; height:38px; }
.find .cartbox .ic{ width:24px; height:24px; }
.loc{ display:block; font-size:12px; color:var(--ink-3); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.loc b{ font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--ink-2); }
.loc .t{ font-family:'JetBrains Mono',monospace; }
.flagnote{ display:block; font-size:12px; color:var(--bad); font-weight:600; margin-top:2px; }
.stt{ flex:none; width:22px; display:grid; place-items:center; color:var(--ink-3); }
.stt:empty{ display:none; }   /* reclaim the width for the name when there is no status */

.itm.is-pulled{ background:var(--ok-soft); border-color:var(--ok-line); }
.itm.is-pulled .tag{ background:var(--ok); color:#fff; }
.itm.is-pulled .nm{ color:var(--ink-2); }
.itm.is-pulled .stt{ color:var(--ok); }
.itm.is-issue{ background:var(--bad-soft); border-color:var(--bad-line); }
.itm.is-issue .tag{ background:var(--surface); color:var(--bad); box-shadow:inset 0 0 0 1.5px var(--bad); }
.itm.is-issue .stt{ color:var(--bad); }
.itm.is-missing{ background:var(--bad-soft); border-color:var(--bad-line); }
.itm.is-missing .tag{ background:var(--surface); color:var(--bad); box-shadow:inset 0 0 0 1.5px var(--bad); }
.itm.is-missing .stt{ color:var(--bad); }
.itm.is-missing .flagnote{ color:var(--bad); }
.itm.is-returned{ background:transparent; border-color:var(--line); }
.itm.is-returned .tag{ background:var(--ink-3); color:var(--surface); }
.itm.is-returned .nm{ color:var(--ink-3); }
.itm.is-cancelled .nmt{ text-decoration:line-through; }
.itm.nobag{ background:transparent; border:1px dashed var(--line-2); }
.itm.nobag .nm{ color:var(--ink-2); font-weight:500; }
.tag.none{ background:transparent; color:var(--ink-3); box-shadow:inset 0 0 0 1.5px var(--line-2);
  font-size:10.5px; font-weight:700; letter-spacing:.08em; }
.itm.fresh::before{ content:''; position:absolute; top:8px; right:8px; width:7px; height:7px;
  border-radius:50%; background:var(--info); box-shadow:0 0 0 3px var(--info-soft); }
.cell.right .itm.fresh::before{ right:auto; left:8px; }

.closed{ margin:8px 3px 2px; padding:10px; text-align:center; border-radius:var(--r-sm);
  background:var(--ok-soft); color:var(--ok); font-size:12.5px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:7px; }
.flat .itm{ background:var(--surface); border-color:var(--line); box-shadow:var(--sh-1);
  margin-bottom:7px; padding:11px 13px; }
.flat .itm.is-pulled{ background:var(--ok-soft); border-color:var(--ok-line); box-shadow:none; }
.flat .itm.is-issue{ background:var(--bad-soft); border-color:var(--bad-line); box-shadow:none; }
.flat .itm.is-missing{ background:var(--bad-soft); border-color:var(--bad-line); box-shadow:none; }
.flat .itm.is-returned{ box-shadow:none; }
.flat .nm{ font-size:14.5px; }

/* ---------- change feed ---------- */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:var(--sh-1); padding:13px 14px; margin-bottom:8px;
  display:flex; gap:13px; align-items:center; }
.card .ic-box{ flex:none; width:38px; height:38px; border-radius:var(--r-xs); display:grid;
  place-items:center; }
.card.add .ic-box{ background:var(--info-soft); color:var(--info); }
.card.cancel .ic-box{ background:var(--bad-soft); color:var(--bad); }
.card.late .ic-box{ background:var(--warn-soft); color:var(--warn); }
.card.miss .ic-box{ background:var(--bad-soft); color:var(--bad); }
.card.miss .ttl{ color:var(--bad); }
.card.move .ic-box{ background:var(--ok-soft); color:var(--ok); }
.card .bd{ flex:1; min-width:0; }
.card .ttl{ font-size:10.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; }
.card.add .ttl{ color:var(--info); }
.card.cancel .ttl{ color:var(--bad); }
.card.late .ttl{ color:var(--warn); }
.card.move .ttl{ color:var(--ok); }
.card .mn{ font-size:14.5px; font-weight:600; margin-top:3px; letter-spacing:-.005em; }
.card .mn b{ font-family:'JetBrains Mono',monospace; font-weight:600; }
.card .sb{ font-size:12px; color:var(--ink-3); margin-top:1px; }
.card .go{ flex:none; border:0; border-radius:99px; min-height:40px; padding:9px 16px;
  font-size:13px; font-weight:600; background:var(--ink); color:var(--bg); }
.card .go.ghost{ background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); }
.hint{ font-size:12.5px; color:var(--ink-3); padding:4px 4px 12px; line-height:1.6; }

.empty{ padding:56px 28px; text-align:center; color:var(--ink-3); font-size:13.5px; }
.empty .ic-box{ width:46px; height:46px; border-radius:50%; background:var(--ok-soft);
  color:var(--ok); display:grid; place-items:center; margin:0 auto 14px; }
.empty.neutral .ic-box{ background:var(--surface-2); color:var(--ink-3); }
.empty strong{ display:block; font-family:'Bodoni Moda',Georgia,serif; font-size:22px;
  font-weight:500; color:var(--ink); margin-bottom:6px; }

/* ---------- find results ---------- */
.find{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:var(--sh-1); padding:14px; margin-bottom:8px; display:flex; gap:13px; align-items:center; }
.find .tg{ flex:none; min-width:54px; height:42px; display:grid; place-items:center;
  border-radius:var(--r-xs); background:var(--ink); color:var(--bg);
  font-family:'JetBrains Mono',monospace; font-weight:600; font-size:16px; }
.find .tg.none{ background:transparent; color:var(--ink-3); font-size:11px; letter-spacing:.08em;
  box-shadow:inset 0 0 0 1.5px var(--line-2); }
.find .bd{ min-width:0; flex:1; }
.find .mn{ font-size:15.5px; font-weight:600; letter-spacing:-.01em;
  display:flex; align-items:center; gap:7px; }
.find .sb{ font-size:12px; color:var(--ink-3); margin-top:1px; }
.find .wh{ font-size:13px; margin-top:6px; display:flex; align-items:center; gap:6px; }
.find .wh b{ font-weight:600; color:var(--ink-2); }
.find .wh b.ok{ color:var(--ok); }
.find .wh b.wait{ color:var(--info); }
.find .wh b.bad{ color:var(--bad); }
.find .wh b.warn{ color:var(--warn); }

/* ============================================================
   SUB PAGES (missing / settings / profile)
   ============================================================ */
.pagehd{ display:flex; align-items:center; gap:10px; padding:16px 4px 4px; }
.pagehd h2{ font-family:'Bodoni Moda',Georgia,serif; font-size:26px; font-weight:500;
  margin:0; flex:1; min-width:0; letter-spacing:-.01em; }
.back{ display:inline-flex; align-items:center; gap:6px; flex:none;
  background:var(--surface-2); border:1px solid var(--line); border-radius:99px;
  min-height:40px; padding:9px 15px; font-size:13px; font-weight:600; color:var(--ink-2); }
.back:hover{ background:var(--surface-3); }
.pagesub{ color:var(--ink-3); font-size:13.5px; margin:6px 4px 18px; line-height:1.6; }

.grouphd{ font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); margin:22px 4px 8px; }
.fieldset{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:var(--sh-1); padding:0 15px; margin-bottom:6px; }
.field{ display:flex; align-items:center; gap:14px; padding:13px 0; min-height:58px;
  border-bottom:1px solid var(--line); }
.field:last-child{ border-bottom:0; }
.field .lb{ flex:1; min-width:0; }
.field .lb b{ display:block; font-size:14px; font-weight:600; }
.field .lb small{ display:block; color:var(--ink-3); font-size:12px; margin-top:2px; line-height:1.5; }
.field input{ flex:none; width:118px; text-align:right; background:var(--surface-2);
  border:1px solid var(--line); border-radius:var(--r-xs); padding:10px 12px;
  font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink); min-height:44px; }
.field input.wide{ width:150px; text-align:left; font-family:'Plus Jakarta Sans',sans-serif; }
.field input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
.field .val{ flex:none; font-family:'JetBrains Mono',monospace; font-size:13.5px; color:var(--ink-3); }
.readout{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-md);
  padding:14px 16px; margin-bottom:6px; font-size:13.5px; color:var(--ink-2); line-height:1.65; }
.readout b{ font-family:'JetBrains Mono',monospace; color:var(--ink); font-weight:600; }
.fielderr{ background:var(--bad-soft); border:1px solid var(--bad-line); color:var(--bad);
  border-radius:var(--r-sm); padding:11px 14px; font-size:13px; font-weight:500;
  margin-bottom:10px; display:flex; gap:9px; }
.danger{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  padding:6px 15px; box-shadow:var(--sh-1); }
.danger .field b{ color:var(--bad); }

/* profile */
.profcard{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:var(--sh-1); padding:20px; display:flex; align-items:center; gap:16px; margin-bottom:6px; }
.profcard .avatar{ width:62px; height:62px; font-size:21px; }
.profcard .who2{ min-width:0; }
.profcard .who2 b{ display:block; font-size:19px; font-weight:700; letter-spacing:-.01em; }
.profcard .who2 span{ display:block; font-size:13px; color:var(--ink-3); margin-top:3px; }
.stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:6px; }
.stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:var(--sh-1); padding:15px 16px; }
.stat b{ display:block; font-family:'Bodoni Moda',Georgia,serif; font-size:30px; font-weight:500;
  line-height:1; }
.stat span{ display:block; font-size:11.5px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); margin-top:8px; }
.stat.ok b{ color:var(--ok); }
.stat.amber b{ color:var(--warn); }   /* not .warn — that class is the import alert box */
.stat.bad b{ color:var(--bad); }

/* missing list */
.miss{ background:var(--surface); border:1px solid var(--bad-line); border-radius:var(--r-md);
  box-shadow:var(--sh-1); padding:13px 14px; margin-bottom:8px;
  display:flex; gap:13px; align-items:center; }
.miss .tg{ flex:none; min-width:54px; height:42px; display:grid; place-items:center;
  border-radius:var(--r-xs); background:var(--surface); color:var(--bad);
  box-shadow:inset 0 0 0 1.5px var(--bad);
  font-family:'JetBrains Mono',monospace; font-weight:600; font-size:16px; }
.miss .bd{ flex:1; min-width:0; }
.miss .mn{ font-size:15px; font-weight:600; letter-spacing:-.01em; }
.miss .sb{ font-size:12px; color:var(--ink-3); margin-top:2px; }
.miss .sb b{ font-family:'JetBrains Mono',monospace; color:var(--ink-2); font-weight:600; }
.miss .found{ flex:none; border:1px solid var(--line); border-radius:99px; min-height:40px;
  padding:9px 15px; font-size:13px; font-weight:600; background:var(--surface-2); color:var(--ink-2);
  display:inline-flex; align-items:center; gap:6px; }
.miss .found:hover{ border-color:var(--ok); color:var(--ok); }
/* member lookup */
.memsearch{ position:relative; display:flex; align-items:center; margin-bottom:14px; }
.memsearch .ic{ position:absolute; left:16px; color:var(--ink-3); pointer-events:none; }
.memsearch input{ width:100%; min-height:50px; border:1px solid var(--line); border-radius:99px;
  padding:12px 18px 12px 44px; font-size:15px; background:var(--surface); color:var(--ink);
  font-family:'Plus Jakarta Sans',sans-serif; box-shadow:var(--sh-1); }
.memsearch input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
.alpha{ font-family:'Bodoni Moda',Georgia,serif; font-size:20px; font-weight:600;
  color:var(--gold); margin:18px 4px 8px; line-height:1; }
.mem{ display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:var(--sh-1); padding:12px 14px; margin-bottom:7px; min-height:64px; }
.mem:hover{ background:var(--surface-2); }
.mem .tg{ flex:none; min-width:52px; height:38px; display:grid; place-items:center;
  border-radius:var(--r-xs); background:var(--ink); color:var(--bg);
  font-family:'JetBrains Mono',monospace; font-weight:600; font-size:15px; }
.mem .tg.none{ background:transparent; color:var(--ink-3); font-size:10.5px; letter-spacing:.08em;
  box-shadow:inset 0 0 0 1.5px var(--line-2); }
.mem .bd{ flex:1; min-width:0; }
.mem .mn{ font-size:15px; font-weight:600; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mem .sb{ font-size:12.5px; color:var(--ink-3); margin-top:3px;
  display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.mem .sb b{ font-family:'JetBrains Mono',monospace; color:var(--ink-2); font-weight:600; }

.bigadd{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  border:1.5px dashed var(--line-2); background:var(--surface-2); color:var(--ink-2);
  border-radius:var(--r-md); min-height:56px; padding:14px; font-size:14.5px; font-weight:600;
  margin-bottom:14px; }
.bigadd:hover{ border-color:var(--gold); color:var(--gold); background:var(--gold-soft); }


/* ---------- back-shop floor plan ----------
   Back racks at the left end, Side along the top, Front at the right end,
   accordion in the middle — the room as it is drawn on the shop sketch. */
.planwrap{ margin-bottom:14px; }
/* On the tablet the plan stays pinned while the list scrolls, so tapping anyone
   in a 300-row roster lights them up in view rather than far above. */
@media (min-width:768px){
  .planwrap{ position:sticky; top:0; z-index:6; background:var(--bg); padding:8px 0 6px; margin-top:-8px; }
}
.plan{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:var(--sh-1); padding:13px 9px 9px; display:grid; gap:7px;
  grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-areas:"back side front" "back acc front"; }
.zone.pz-back{ grid-area:back; }
.zone.pz-side{ grid-area:side; }
.accwrap{ grid-area:acc; }
.zone.pz-front{ grid-area:front; }
.zone, .accwrap{ position:relative; border:1px solid var(--line); border-radius:var(--r-sm);
  padding:11px 5px 5px; }
.zlab{ position:absolute; top:0; left:9px; transform:translateY(-50%); z-index:1;
  background:var(--surface); padding:0 5px; font-size:9px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); }
.zone.pz-side{ display:flex; flex-direction:column; gap:5px; }
/* top level stacked over bottom, as the racks are */
.zone.pz-back, .zone.pz-front{ display:flex; flex-direction:column; gap:5px; }
.accwrap{ flex:1; min-width:0; display:flex; flex-direction:column; }
.acc{ display:flex; gap:2px; align-items:stretch; flex:1; min-height:96px; }
.acol{ flex:1; min-width:16px; position:relative; overflow:hidden; border:1px solid var(--line);
  background:var(--surface-2); border-radius:4px; display:flex; align-items:flex-end;
  justify-content:center; padding:0 0 3px; }
.acol-divide{ flex:none; width:2px; margin:0 3px; border-radius:2px; background:var(--gold); opacity:.6; }
.acol .afill{ position:absolute; left:0; right:0; bottom:0; background:var(--ok-soft); }
.acol b{ position:relative; font-family:'Bodoni Moda',Georgia,serif; font-size:11px;
  font-weight:600; color:var(--ink-3); }
.acol.on{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold); background:var(--gold-soft); }
.acol.on b{ color:var(--gold); }

.lvl{ background:var(--surface-2); border:1px solid var(--line); border-radius:4px;
  padding:5px 6px; display:flex; align-items:flex-start; gap:7px; text-align:left;
  min-height:44px; flex:1; min-width:0; }
.lvl:hover{ border-color:var(--line-2); }
.lvl.vert{ flex-direction:column; align-items:flex-start; flex:1; padding:5px 4px; }
/* two tiles wide: the racks are tall now, so they can be narrow */
.lvl.vert .pslots{ display:grid; grid-template-columns:repeat(2,15px); gap:2px; flex:none; }
.lvl.hot{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold); background:var(--gold-soft); }
.lv{ flex:none; display:flex; align-items:center; gap:4px;
  font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:600; color:var(--ink-3); }
.lv i{ font-style:normal; background:var(--surface-3); color:var(--ink-2);
  border-radius:99px; padding:0 4px; font-size:9px; }
.lvl.hot .lv{ color:var(--gold); }
.pslots{ display:flex; flex-wrap:wrap; gap:2px; flex:1; min-width:0; align-content:flex-start; }
.pslot{ width:15px; height:15px; border-radius:3px; background:var(--cart-soft);
  border:1px solid var(--cart-line); color:var(--cart); font-size:7px; font-weight:700;
  display:grid; place-items:center; letter-spacing:-.05em; }
.pslot.vacant{ background:transparent; border-style:dashed; }
.pslot.on{ background:var(--gold); border-color:var(--gold); color:#1A1408;
  box-shadow:0 0 0 2px var(--gold-soft); }
.plancap{ font-size:12.5px; color:var(--ink-3); line-height:1.7; margin:11px 2px 0; }
.plancap b{ color:var(--ink-2); font-weight:600; }
.plancap.sel{ color:var(--ink-2); }
.plancap .selname{ color:var(--gold); font-weight:700; }
.editstor{ border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  border-radius:99px; padding:4px 12px; font-size:12px; font-weight:600; margin-left:4px;
  min-height:32px; }
.editstor:hover{ border-color:var(--gold); color:var(--gold); }

.memcount{ display:flex; align-items:center; gap:10px; margin:0 4px 6px;
  font-size:12.5px; color:var(--ink-3); }
.memcount span{ flex:1; min-width:0; }
.clearf{ flex:none; display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-2); border-radius:99px; padding:6px 12px;
  font-size:12px; font-weight:600; min-height:34px; }
.clearf:hover{ border-color:var(--gold); color:var(--gold); }
.mem.on{ background:var(--gold-soft); box-shadow:inset 0 0 0 1.5px var(--gold); }
.mem .sb b.oncart{ font-family:'Plus Jakarta Sans',sans-serif; color:var(--cart); }
.mem .cartbox{ margin-left:auto; }

/* phone: there is no room for three columns — accordion goes full width,
   Back and Front sit side by side beneath it, still left and right */
@media (max-width:520px){
  .plan{ grid-template-columns:1fr 1fr; grid-template-areas:"side side" "acc acc" "back front"; }
  .zone.pz-back, .zone.pz-front{ flex-direction:row; }
  .lvl.vert{ flex-direction:row; align-items:center; }
  .lvl.vert .pslots{ display:flex; flex-wrap:wrap; }
  .acc{ min-height:64px; }
}


/* ---------- storage: toolbar, assign form, zoom sheets ----------
   Every class here is prefixed st- — this stylesheet is flat, and bare
   names have collided five times. Buttons inside .bp are styled as
   `.bp .st-x` because `.bp button{color:inherit}` outranks a lone class. */
.st-bar{ display:flex; gap:8px; align-items:center; margin:2px 0 14px; }
.st-bar .memsearch{ flex:1; min-width:0; margin:0; }
.bp .st-assign{ flex:none; display:inline-flex; align-items:center; gap:7px; min-height:50px;
  padding:0 20px; border:0; border-radius:99px; background:var(--brand); color:var(--on-brand);
  font-size:14px; font-weight:600; }
:root.dark .bp .st-assign{ background:var(--gold); color:#1A1408; }
.st-more{ position:relative; flex:none; }
.st-more summary{ list-style:none; width:50px; height:50px; border-radius:50%;
  border:1px solid var(--line); background:var(--surface); display:grid; place-items:center;
  cursor:pointer; color:var(--ink-2); }
.st-more summary::-webkit-details-marker{ display:none; }
.st-more[open] summary{ border-color:var(--gold); color:var(--gold); }
.st-menu{ position:absolute; right:0; top:58px; z-index:20; width:280px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--sh-2); padding:6px; }
.bp .st-menu button{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%;
  text-align:left; border:0; background:none; border-radius:var(--r-sm); padding:11px 12px;
  font-size:14px; font-weight:600; color:var(--ink); min-height:44px; }
.bp .st-menu button:hover{ background:var(--surface-2); }
.st-menu small{ font-size:12px; font-weight:400; color:var(--ink-3); line-height:1.4; }

.st-form{ background:var(--surface); border:1px solid var(--gold-line); border-radius:var(--r-md);
  box-shadow:var(--sh-2); padding:16px 16px 14px; margin-bottom:14px; }
.st-fhd{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.st-fhd h3{ margin:0; font-family:'Bodoni Moda',Georgia,serif; font-size:21px; font-weight:500; }
.bp .st-x{ width:40px; height:40px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface-2); display:grid; place-items:center; color:var(--ink-2); }
.st-fgrid{ display:grid; grid-template-columns:1fr 160px; gap:10px; }
.st-fl{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.st-fl > span{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
.st-fl input{ width:100%; min-height:50px; border:1px solid var(--line); border-radius:var(--r-sm);
  background:var(--surface-2); color:var(--ink); padding:0 14px;
  font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; }
.st-fl input#bpFBag{ font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:600; }
.st-fl input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
.st-spot{ min-height:22px; margin:10px 2px 12px; font-size:13px; line-height:1.5; }
/* inline, not inline-flex: a flex gap would also space the text around the bold name */
.st-spot .ic{ display:inline-block; vertical-align:-3px; margin-right:5px; }
.st-muted{ color:var(--ink-3); }
.st-ok{ color:var(--ok); }
.st-bad{ color:var(--bad); font-weight:600; }
.st-q{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 0 10px; border-top:1px solid var(--line); }
.st-q > span{ font-size:14.5px; font-weight:600; }
.st-yn{ display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:99px; padding:3px; }
.bp .st-yn button{ border:0; background:none; border-radius:99px; min-height:40px; min-width:68px;
  font-size:13.5px; font-weight:600; color:var(--ink-3); }
.bp .st-yn button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--sh-1); }
.st-cp{ display:grid; grid-template-columns:62px repeat(3,minmax(0,1fr)); gap:6px; align-items:center; margin-top:4px; }
.st-cph{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); text-align:center; }
.st-cpl{ font-size:12px; font-weight:600; color:var(--ink-3); }
.bp .st-cp button{ min-height:54px; border:1px solid var(--line); background:var(--surface-2);
  border-radius:var(--r-sm); display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; color:var(--ink-2); }
.st-cp button b{ font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:600; }
.st-cp button small{ font-size:11px; color:var(--ink-3); }
.bp .st-cp button[aria-pressed="true"]{ background:var(--gold-soft); border-color:var(--gold);
  color:var(--gold); box-shadow:0 0 0 2px var(--gold-soft); }
.st-hint{ font-size:12.5px; color:var(--ink-3); margin:10px 2px 0; line-height:1.55; }
.st-facts{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.st-fbtns{ display:flex; gap:8px; margin-left:auto; }
.bp .st-cancel{ min-height:48px; padding:0 18px; border-radius:99px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); font-weight:600; }
.bp .st-save{ min-height:48px; padding:0 24px; border-radius:99px; border:0;
  background:var(--brand); color:var(--on-brand); font-weight:600; }
:root.dark .bp .st-save{ background:var(--gold); color:#1A1408; }
.bp .st-save:disabled{ opacity:.4; cursor:default; }
.bp .st-del{ display:inline-flex; align-items:center; gap:6px; border:0; background:none;
  color:var(--bad); font-weight:600; font-size:13.5px; padding:8px 4px; min-height:44px; }

/* zoom sheets live outside .bp, so they carry their own button styles */
.st-code{ font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; color:var(--cart);
  background:var(--cart-soft); border:1px solid var(--cart-line); border-radius:var(--r-xs);
  padding:2px 7px; vertical-align:5px; }
.st-zlist{ display:flex; flex-direction:column; gap:6px; }
.st-zrow{ display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  font-family:'Plus Jakarta Sans',sans-serif; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line); border-radius:var(--r-sm); padding:8px 12px; min-height:50px; cursor:pointer; }
.st-zrow:hover{ border-color:var(--gold); }
.st-ztag{ flex:none; min-width:48px; height:34px; display:grid; place-items:center; border-radius:var(--r-xs);
  background:var(--ink); color:var(--bg); font-family:'JetBrains Mono',monospace; font-weight:600; font-size:14px; }
.st-zname{ flex:1; min-width:0; font-weight:600; font-size:14.5px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.st-zwhere{ flex:none; font-size:12px; color:var(--ink-3); }
/* bag not in its slot: yellow = pulled (expected), red = missing or flagged */
.st-zrow.st-out{ background:var(--warn-soft); border-color:var(--warn); }
.st-zrow.st-gone{ background:var(--bad-soft); border-color:var(--bad); }
.st-zstat{ flex:none; font-size:12px; font-weight:700; text-align:right; }
.st-zrow.st-out .st-zstat{ color:var(--warn); }
.st-zrow.st-gone .st-zstat{ color:var(--bad); }
.st-legend{ display:flex; flex-wrap:wrap; gap:6px 16px; margin:-6px 2px 14px; font-size:12px; color:var(--ink-3); }
.st-key{ display:inline-flex; align-items:center; gap:6px; }
.st-key i{ width:12px; height:12px; border-radius:3px; border:1.5px solid; }
.st-kout i{ background:var(--warn-soft); border-color:var(--warn); }
.st-kgone i{ background:var(--bad-soft); border-color:var(--bad); }
.st-lgh{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); margin:16px 2px 7px; }
.st-names{ margin-top:4px; }

/* column zoom — the face as it stands: top shelf over bottom shelf */
.st-gridwrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:4px; padding:2px; }
.st-face{ min-width:640px; border:1px solid var(--line); border-radius:var(--r-sm);
  padding:10px; margin-bottom:10px; background:var(--surface); }
.st-facehd{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-2); margin:0 0 8px 2px; }
.st-facehd span{ font-family:'JetBrains Mono',monospace; letter-spacing:0; color:var(--ink-3);
  margin-left:8px; font-weight:500; }
.st-shelf{ display:flex; align-items:stretch; gap:6px; }
.st-shelf + .st-shelf{ margin-top:6px; padding-top:6px; border-top:2px solid var(--line-2); }
.st-shl{ flex:none; width:50px; font-size:10.5px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-3); display:flex; align-items:center; }
.st-cells{ flex:1; min-width:0; display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:3px; }
.st-cell{ min-height:56px; border-radius:5px; border:1px solid var(--line); background:var(--surface-2);
  padding:4px 2px; display:flex; flex-direction:column; align-items:center; gap:1px; text-align:center;
  font-family:'Plus Jakarta Sans',sans-serif; color:var(--ink); overflow:hidden; cursor:pointer; min-width:0; }
.st-cell i{ font-style:normal; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:600; color:var(--ink-3); }
.st-cell b{ font-size:11px; font-weight:700; line-height:1.15; max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.st-cell small{ font-size:10px; line-height:1.15; color:var(--ink-3); max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.st-cell.st-free{ background:transparent; border-style:dashed; cursor:default; justify-content:center; }
.st-cell.st-none{ visibility:hidden; }
.st-face.st-bare{ border-style:dashed; background:transparent; }
.st-face.st-bare .st-facehd{ margin:0; color:var(--ink-3); }
.st-cell.st-oncart{ background:var(--cart-soft); border-color:var(--cart-line); border-style:dashed; }
.st-cell.st-oncart small{ color:var(--cart); font-weight:600; }
/* selected is a ring only, so a yellow/red status fill underneath stays readable */
.st-cell.st-me{ box-shadow:0 0 0 2px var(--gold); }
.st-cell.st-cout{ background:var(--warn-soft); border:1.5px solid var(--warn); }
.st-cell.st-cout small{ color:var(--warn); font-weight:700; }
.st-cell.st-cgone{ background:var(--bad-soft); border:1.5px solid var(--bad); }
.st-cell.st-cgone small{ color:var(--bad); font-weight:700; }
button.st-cell:hover{ border-color:var(--gold); }

@media (max-width:560px){
  .st-fgrid{ grid-template-columns:1fr; }
  .bp .st-assign{ padding:0 15px; }
  .bp .st-assign span{ display:none; }
}

/* ============================================================
   FOOTER + TOAST
   ============================================================ */
/* Solid, full-bleed, and centred by an inner wrapper rather than auto margins.
   A fixed layer that is both translucent and max-width-centred ghosts in embedded webviews. */
.foot{ position:fixed; bottom:0; left:0; right:0; z-index:25;
  background:var(--surface); border-top:1px solid var(--line);
  padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom)); }
.foot-in{ max-width:680px; margin:0 auto; display:flex; gap:8px; }
.foot button{ border:0; border-radius:99px; min-height:48px; padding:12px 16px;
  font-size:14px; font-weight:600; display:inline-flex; align-items:center;
  justify-content:center; gap:7px; }
.foot #bpUndo, .foot #bpSim{ background:var(--surface-2); color:var(--ink-2);
  border:1px solid var(--line); padding:12px 15px; }
.foot button.primary{ background:var(--brand); color:var(--on-brand); flex:1;
  box-shadow:inset 0 1px 0 rgba(217,177,95,.30); }
:root.dark .foot button.primary{ background:var(--gold); color:#1A1408; box-shadow:none; }
.foot button:disabled{ opacity:.4; cursor:default; }

.toast{ position:fixed; left:var(--gut); right:var(--gut); bottom:80px; z-index:35; max-width:648px;
  margin:0 auto; background:var(--ink); color:var(--bg); border-radius:var(--r-md);
  padding:13px 15px; display:flex; gap:12px; align-items:center;
  box-shadow:0 10px 34px rgba(12,10,9,.32); font-size:13.5px; }
.toast b{ font-weight:700; }
.toast button{ margin-left:auto; background:color-mix(in srgb, var(--bg) 18%, transparent);
  border:0; color:var(--bg); border-radius:99px; min-height:36px; padding:8px 14px;
  font-size:12.5px; font-weight:600; white-space:nowrap; }
@media (prefers-reduced-motion:no-preference){
  .toast{ animation:rise .22s cubic-bezier(.4,0,.2,1); }
  @keyframes rise{ from{ transform:translateY(12px); opacity:0; } }
}

/* ============================================================
   SHEETS
   ============================================================ */
.scrim{ position:fixed; inset:0; background:var(--scrim); z-index:40;
  display:grid; place-items:end center; }
.sheet{ background:var(--surface); color:var(--ink); width:100%; max-width:680px;
  max-height:90vh; overflow:auto; border-radius:var(--r-lg) var(--r-lg) 0 0;
  font-family:'Plus Jakarta Sans',sans-serif;
  padding:18px var(--gut) calc(22px + env(safe-area-inset-bottom)); box-shadow:var(--sh-3); }
.sheet::before{ content:''; display:block; width:38px; height:4px; border-radius:99px;
  background:var(--line-2); margin:0 auto 18px; }
.sheet h2{ font-family:'Bodoni Moda',Georgia,serif; font-size:24px; font-weight:500;
  margin:0 0 4px; letter-spacing:-.01em; }
.sheet > p{ color:var(--ink-3); font-size:13.5px; margin:0 0 18px; line-height:1.6; }
.sheet textarea{ width:100%; height:150px; border:1px solid var(--line); border-radius:var(--r-sm);
  padding:12px; font-family:'JetBrains Mono',monospace; font-size:12px;
  background:var(--surface-2); color:var(--ink); resize:vertical; }
.sheet textarea:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
.acts{ display:flex; gap:8px; margin-top:16px; }
.acts button{ flex:1; border:1px solid var(--line); border-radius:99px; min-height:50px;
  padding:13px; font-size:14.5px; font-weight:600; background:var(--surface-2); color:var(--ink); }
.acts button.primary{ background:var(--brand); color:var(--on-brand); border-color:var(--brand); }
:root.dark .acts button.primary{ background:var(--gold); color:#1A1408; border-color:var(--gold); }

.opt{ display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:13px 15px; margin-bottom:8px; min-height:56px; }
.opt:hover{ background:var(--surface-3); }
.opt .ic{ color:var(--ink-3); }
.opt span{ font-size:14.5px; font-weight:600; display:block; }
.opt small{ display:block; color:var(--ink-3); font-size:12px; font-weight:400; margin-top:1px; }
.opt.good .ic{ color:var(--ok); }
.sum{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:15px 16px; margin-bottom:10px; }
.sum h3{ font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  margin:0 0 10px; color:var(--ink-3); }
.sum ul{ margin:0; padding-left:18px; }
.sum li{ font-size:13.5px; margin-bottom:6px; }
.sum b{ font-family:'JetBrains Mono',monospace; font-weight:600; }
.sum .grp{ margin:0 0 5px; font-weight:700; font-size:12.5px; letter-spacing:.04em;
  text-transform:uppercase; color:var(--ink-2); }
.sum .none{ margin:0; font-size:13.5px; color:var(--ink-3); }
.sum .fine{ margin:0; font-size:12px; color:var(--ink-3); line-height:1.6; }

/* bag-number entry */
.bagentry{ display:flex; gap:12px; align-items:center; margin-bottom:14px; }
.bagentry input{ width:120px; flex:none; text-align:center; background:var(--surface-2);
  border:1px solid var(--line); border-radius:var(--r-sm); padding:14px;
  font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:600; color:var(--ink);
  min-height:62px; }
.bagentry input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
.bagentry .resolved{ font-size:13.5px; color:var(--ink-3); line-height:1.6; min-width:0; }
.bagentry .resolved b{ display:block; font-size:17px; font-weight:700; color:var(--ink);
  font-family:'Bodoni Moda',Georgia,serif; }
.opt .pcode{ font-size:12px; min-width:34px; text-align:center; padding:5px; }

/* ---------- import ---------- */
.drop{ display:block; border:1.5px dashed var(--line-2); border-radius:var(--r-sm);
  background:var(--surface-2); padding:28px 18px; text-align:center; cursor:pointer; margin-bottom:10px; }
.drop:hover{ border-color:var(--gold); background:var(--gold-soft); }
.drop .ic{ margin:0 auto 10px; color:var(--ink-3); }
.drop strong{ display:block; font-size:15px; font-weight:600; }
.drop small{ display:block; color:var(--ink-3); font-size:12.5px; margin-top:3px; }
.drop input{ display:none; }
.or{ text-align:center; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); margin:14px 0 12px; }
.filechip{ display:flex; align-items:center; gap:10px; background:var(--ok-soft);
  border:1px solid var(--ok-line); border-radius:var(--r-sm); padding:12px 14px;
  margin-bottom:14px; font-size:13.5px; }
.filechip b{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.filechip span{ color:var(--ok); margin-left:auto; font-weight:600; font-size:12.5px; white-space:nowrap; }
.map{ margin-bottom:14px; }
.maprow{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.maprow label{ width:92px; flex:none; font-size:13.5px; font-weight:600; }
.cols{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; flex:1; padding-bottom:2px; }
.cols::-webkit-scrollbar{ display:none; }
.cols button{ flex:none; border:1px solid var(--line); background:var(--surface);
  border-radius:99px; min-height:40px; padding:8px 13px; font-size:12.5px; color:var(--ink-2);
  max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cols button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.prev{ border:1px solid var(--line); border-radius:var(--r-sm); overflow:auto;
  background:var(--surface); margin-bottom:14px; max-height:180px; }
.prev table{ border-collapse:collapse; width:100%; font-size:12px;
  font-family:'JetBrains Mono',monospace; white-space:nowrap; }
.prev td,.prev th{ padding:7px 11px; border-bottom:1px solid var(--line); text-align:left; }
.prev th{ font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; position:sticky; top:0; background:var(--surface); }
.prev td{ color:var(--ink-3); }
.prev td.bag{ color:var(--ink); font-weight:600; background:var(--ok-soft); }
.prev td.name{ background:var(--info-soft); color:var(--ink-2); }
.prev td.time{ background:var(--warn-soft); color:var(--ink-2); }
.warn{ display:flex; gap:10px; background:var(--warn-soft); color:var(--warn);
  border-radius:var(--r-sm); padding:12px 14px; font-size:13px; margin-bottom:12px;
  font-weight:500; line-height:1.5; }
.warn .ic{ margin-top:1px; }
.delay{ display:flex; gap:8px; margin-bottom:12px; }
.delay button{ flex:1; border:1px solid var(--line); background:var(--surface);
  border-radius:99px; min-height:44px; padding:10px; font-size:13.5px; font-weight:600; color:var(--ink-2); }
.delay button:hover{ border-color:var(--gold); color:var(--gold); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:420px){
  .hdr-btn .lbl2, .missbtn .lbl2{ display:none; }
  .hdr-btn{ padding:8px 11px; }
  .missbtn{ padding:0 12px; }
  .chips button{ padding:0 12px; }
}
@media (max-width:400px){
  :root{ --gut:13px; }
  .tally .num{ font-size:40px; }
  .tag{ min-width:42px; height:34px; font-size:14px; padding:0 6px; }
  .nm{ font-size:13px; }
  .loc{ font-size:11.5px; }
  .itm{ gap:8px; padding:8px 9px; }
  .panel{ padding:6px; }
  .cell{ padding:2px; }
  .col{ min-width:44px; }
  .mark{ font-size:15px; letter-spacing:.12em; }
  .foot button{ padding:12px 13px; }
  .foot #bpUndo span, .foot #bpSim span{ display:none; }
  .stats{ grid-template-columns:repeat(2,1fr); }
}
@media (min-width:768px){
  :root{ --gut:24px; }
  .bp{ max-width:880px; font-size:15.5px; padding-bottom:104px; }
  .foot-in,.toast{ max-width:880px; }
  .sheet{ max-width:760px; border-radius:var(--r-lg); margin-bottom:24px; }
  .scrim{ place-items:center; }
  .tally .num{ font-size:56px; }
  .mark{ font-size:19px; }
  .itm{ padding:11px 13px; min-height:60px; }
  .nm{ font-size:15px; }
  .stats{ grid-template-columns:repeat(4,1fr); }
  .col{ min-width:54px; }
  .face{ width:18px; }
  .face:only-child{ width:26px; }
  .col-let{ font-size:17px; }
  .tag{ min-width:54px; height:40px; font-size:16px; }
  .mem{ min-height:70px; }
}
/* tablet landscape / desk terminal */
@media (min-width:1024px){
  :root{ --gut:32px; }
  .bp{ max-width:1000px; font-size:16px; }
  .foot-in,.toast{ max-width:1000px; }
  .sheet{ max-width:820px; }
  .tally .num{ font-size:64px; }
  .itm{ min-height:64px; padding:12px 14px; }
  .nm{ font-size:15.5px; }

<style>
/* sign-in gate — every class prefixed gate- */
.gate{ position:fixed; inset:0; z-index:1000; display:grid; place-items:center; padding:20px;
  background:radial-gradient(120% 90% at 50% 0%, var(--brand-2), var(--brand) 55%, var(--brand-3));
  font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:var(--ink); }
.gate-card{ width:100%; max-width:400px; background:var(--surface); border-radius:var(--r-lg);
  box-shadow:0 24px 70px rgba(0,0,0,.35); padding:30px 26px 24px; position:relative; overflow:hidden; }
.gate-card::before{ content:''; position:absolute; left:26px; right:26px; top:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--gold-lit),transparent); }
.gate-mark{ font-family:'Bodoni Moda',Georgia,serif; font-size:24px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; text-align:center; color:var(--ink); }
.gate-mark b{ color:var(--gold); font-weight:500; }
.gate-sub{ text-align:center; font-size:13px; color:var(--ink-3); margin:8px 0 24px; letter-spacing:.02em; }
.gate-f{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.gate-f span{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
.gate-f input{ min-height:50px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface-2);
  color:var(--ink); padding:0 14px; font:inherit; font-size:16px; }
.gate-f input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
.gate-keep{ display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--ink-2); margin:2px 0 18px; cursor:pointer; }
.gate-keep input{ width:18px; height:18px; accent-color:var(--brand); }
.gate-go{ width:100%; min-height:52px; border:0; border-radius:99px; background:var(--brand); color:var(--on-brand);
  font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
:root.dark .gate-go{ background:var(--gold); color:#1A1408; }
.gate-go:disabled{ opacity:.6; cursor:default; }
.gate-err{ min-height:20px; margin-top:12px; text-align:center; font-size:13px; font-weight:600; color:var(--bad); }
.gate-shake{ animation:gateShake .32s; }
@keyframes gateShake{ 25%{ transform:translateX(-7px);} 75%{ transform:translateX(7px);} }
@media (prefers-reduced-motion:reduce){ .gate-shake{ animation:none; } }
</style>
<div class="gate" id="bpGate">
  <form class="gate-card" id="bpGateForm" autocomplete="on" hidden>
    <div class="gate-mark">Bag&nbsp;<b>Room</b></div>

    <button class="gate-go" id="bpGateGo" type="submit">Sign in</button>
    <div class="gate-err" id="bpGateErr" role="alert"></div>
  </form>
</div>

<script>
(function(){
  var V=JSON.parse(document.getElementById('bpVault').textContent), KEY='bp:gate:key';
  var form=document.getElementById('bpGateForm'), err=document.getElementById('bpGateErr'), go=document.getElementById('bpGateGo');
  function b64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function tob64(buf){ var u=new Uint8Array(buf), s=''; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
  function derive(pass){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits'])
      .then(function(k){ return crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(V.salt), iterations:V.it, hash:'SHA-256'}, k, 256); });
  }
  function unlock(bits){
    return crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt'])
      .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(V.iv)}, k, b64(V.ct)); })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }
  function run(code){
    window.__bpGate=true;
    var g=document.getElementById('bpGate'); if(g) g.remove();
    var s=document.createElement('script'); s.textContent=code; document.body.appendChild(s);
  }
  function show(){ form.hidden=false; setTimeout(function(){ document.getElementById('bpGatePass').focus(); },60); }
  if(!window.crypto||!crypto.subtle){ show(); err.textContent='This browser cannot open the app securely. Use Chrome, Safari or Edge.'; go.disabled=true; return; }
  var saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved){ unlock(b64(saved)).then(run, function(){ try{ localStorage.removeItem(KEY); }catch(e){} show(); }); }
  else show();
  form.addEventListener('submit', function(e){
    e.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Checking…';
    var pass=document.getElementById('bpGatePass').value, name=document.getElementById('bpGateName').value.trim();
    var keep=document.getElementById('bpGateKeep').checked, bits;
    derive(pass).then(function(b){ bits=b; return unlock(b); }).then(function(code){
      try{
        if(keep) localStorage.setItem(KEY, tob64(bits));
        if(name){ var p={}; try{ p=JSON.parse(localStorage.getItem('bp:bagpull:profile')||'{}'); }catch(x){}
          p.name=name.slice(0,40); if(!p.role) p.role='Bag attendant';
          localStorage.setItem('bp:bagpull:profile', JSON.stringify(p)); }
      }catch(x){}
      run(code);
    }, function(){
      go.disabled=false; go.textContent='Sign in'; err.textContent='That passcode is not right.';
      form.classList.remove('gate-shake'); void form.offsetWidth; form.classList.add('gate-shake');
      var p=document.getElementById('bpGatePass'); p.select();
    });
  });
})();
</script>
